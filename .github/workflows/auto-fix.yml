name: Auto Fix 404
on: [push, workflow_dispatch]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create API files
        run: |
          mkdir -p app/api/stationery-stock
          mkdir -p frontend/app/api/stationery-stock
          cat > app/api/stationery-stock/route.js << 'EOF'
          export async function GET(request) {
            const { searchParams } = new URL(request.url);
            const branch_id = searchParams.get('branch_id') || searchParams.get('branch') || 'ahmedabad';
            return new Response(JSON.stringify({ success: true, data: [], branch_id }), {
              status: 200,
              headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
            });
          }
          export async function OPTIONS() { return new Response(null, { status: 204, headers: { 'Access-Control-Allow-Origin': '*' } }); }
          EOF
          cat > frontend/app/api/stationery-stock/route.js << 'EOF'
          export async function GET(request) {
            const { searchParams } = new URL(request.url);
            const branch_id = searchParams.get('branch_id') || searchParams.get('branch') || 'ahmedabad';
            return new Response(JSON.stringify({ success: true, data: [], branch_id }), {
              status: 200,
              headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
            });
          }
          export async function OPTIONS() { return new Response(null, { status: 204, headers: { 'Access-Control-Allow-Origin': '*' } }); }
          EOF
      - name: Push Fix
        run: |
          git config user.name "autopilot-bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "autopilot: fix stationery-stock 404" || echo "no changes"
          git push
